[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frida-mcp"
version = "0.4.0"
description = "Model Context Protocol implementation for Frida (frida >= 17)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]
dependencies = ["fastmcp>=4,<5", "frida>=17,<18"]

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=8", "ruff>=0.16.5", "ty>=0.0.77"]

[project.scripts]
frida-mcp = "frida_mcp.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "UP", "SIM", "RUF"]
# FastMCP requires Field(...) in parameter defaults to expose JSON schemas.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/frida_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/frida_mcp/*.py",
    "src/frida_mcp/py.typed",
    "src/frida_mcp/tools/*.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]